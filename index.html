<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do Computador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Painel do Computador</h1>

  <section>
    <h2>Navegador e sistema</h2>
    <table id="sistema"></table>
  </section>

<section>
    <h2>Desempenho gráfico</h2>
    <table id="grafico"></table>
  </section>

  <section>
    <h2>Tela e janela</h2>
    <table id="tela"></table>
  </section>

  <section>
    <h2>Localização</h2>
    <button id="btn-local">Mostrar minha localização</button>
    <p id="local"></p>
  </section>

  <section>
    <h2>Data e hora</h2>
    <table id="data-hora"></table>
  </section>

  <section>
    <h2>internet</h2>
    <table id="internet"></table>
  </section>
 <section>

    <h2>Arquivos</h2>
    <input type="file" id="arquivos" multiple>
    <table id="lista-arquivos"></table>
  </section>
  
  <script src="script.js"></script>
</body>
</html>
